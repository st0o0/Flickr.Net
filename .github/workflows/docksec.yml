name: DockSec

on:
  pull_request:
    paths:
      - 'src/Directory.Packages.props'
      - 'src/**/*.csproj'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: docksec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    uses: st0o0/github-workflows/.github/workflows/docksec.yml@main
    with:
      scan-type: fs
    permissions:
      contents: read
      security-events: write
