name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    uses: st0o0/github-workflows/.github/workflows/release-please.yml@main
    permissions:
      contents: write
      pull-requests: write

  nuget:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: st0o0/github-workflows/.github/workflows/dotnet-release-nuget.yml@main
    with:
      version: ${{ needs.release-please.outputs.version }}
      solution-file: Flickr.Net.slnx
      package-name: Flickr.Net
    secrets:
      NUGET_USER: ${{ secrets.NUGET_USER }}
    permissions:
      contents: write
      checks: write
      id-token: write
