name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '38 2 * * 2'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    uses: st0o0/github-workflows/.github/workflows/codeql.yml@main
    with:
      language: csharp
    permissions:
      contents: read
      security-events: write
